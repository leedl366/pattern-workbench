<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>素材库 · 速图AIGC</title>
<link rel="icon" type="image/svg+xml" href="../favicon.svg">
<link rel="stylesheet" href="../accounts/static/ui.css">
<!-- 共用「原图 / 成品」对比组件：素材库的对比入口只用它的全屏并排灯箱 PTCompare.zoom() ——
     两张同时放大、走 /api/trim 裁掉四周白边、按真实比例等高零缝隙（tight）。 -->
<script src="../accounts/static/cmp-20261015b.js"></script>
<style>
/* 令牌来自 ui.css，本页只留布局；板块角标色是板块身份色 */
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font);color:var(--tx);background:var(--bg)}
.hd{position:sticky;top:0;z-index:5;background:var(--card);border-bottom:1px solid var(--bd);padding:12px 22px 0;display:flex;flex-direction:column;gap:0}
.hd .r1{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.hd h1{font-size:18px;font-weight:800}
.hd .tip{font-size:12px;color:var(--sub)}
.hd .right{margin-left:auto;display:flex;align-items:center;gap:8px}
.search{border:1px solid var(--bd);border-radius:var(--r-ctl);padding:6px 12px;font-size:12.5px;width:170px;outline:none;font-family:var(--font);background:var(--card);color:var(--tx)}
.search:focus{border-color:var(--pri-200);box-shadow:0 0 0 3px var(--pri-050)}
.rbtn{padding:6px 14px;border-radius:var(--r-ctl);font-size:13px;font-weight:600;color:var(--pri-dark);background:var(--pri-050);border:1px solid var(--pri-200);cursor:pointer;user-select:none;white-space:nowrap}
.rbtn.on{background:var(--pri);color:var(--on-pri);border-color:var(--pri)}

/* 一级分类：8 板块 chips（带计数） */
.chips{display:flex;gap:6px;padding:10px 0;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:999px;border:1px solid var(--bd);background:var(--card);font-size:12.5px;font-weight:700;color:var(--sub);cursor:pointer;user-select:none;transition:.12s}
.chip:hover{border-color:var(--pri-200);color:var(--pri-dark)}
.chip.on{background:var(--pri-050);color:var(--pri-dark);border-color:var(--pri-200)}
.chip .n{font-size:11px;font-weight:800;background:var(--bg);border-radius:5px;padding:0 5px;min-width:17px;text-align:center;color:var(--faint)}
.chip.on .n{background:#fff;color:#111214}
.chip .cd{width:8px;height:8px;border-radius:50%;flex:none}

/* 二级筛选 */
.bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:0 0 10px;border-bottom:1px solid var(--bd)}
.bar label{font-size:11px;font-weight:800;color:var(--faint);letter-spacing:.3px}
.bar select{border:1px solid var(--bd);border-radius:var(--r-sm);padding:4px 7px;font-size:12.5px;font-family:var(--font);color:var(--sub);background:var(--card);outline:none;cursor:pointer;max-width:150px}
.bar .cnt{margin-left:auto;font-size:12px;color:var(--sub);font-weight:700}
.bar .cnt b{color:var(--pri-dark)}
.vt{display:flex;border:1px solid var(--bd);border-radius:var(--r-sm);overflow:hidden;background:var(--card)}
.vt span{padding:4px 10px;font-size:12px;font-weight:700;color:var(--sub);cursor:pointer;user-select:none}
.vt span.on{background:var(--pri-050);color:var(--pri-dark)}
.vt span+span{border-left:1px solid var(--bd)}
.fbtn{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:var(--r-sm);border:1px solid var(--bd);background:var(--card);font-size:12px;font-weight:700;color:var(--sub);cursor:pointer;user-select:none}
.fbtn.on{background:rgba(251,191,36,.14);border-color:rgba(251,191,36,.35);color:#fbbf24}
.fbtn i{font-style:normal;font-size:11px;font-weight:800;color:var(--faint)}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px;padding:16px 22px 8px}
.grid>*{min-width:0}
.card{position:relative;background:var(--card);border:1px solid var(--bd);border-radius:var(--r-card);overflow:hidden;display:flex;flex-direction:column;transition:.15s}
.card:hover{box-shadow:0 4px 16px rgba(13,148,136,.10);border-color:var(--pri-200)}
.th{position:relative;height:152px;background:var(--card2);display:flex;align-items:center;justify-content:center;overflow:hidden;flex:none;cursor:zoom-in}
.th img{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none;-webkit-user-drag:none}
/* .ph 同时用于卡片缩略图位与时间轴小图位（已过期 / 无图 / 图裂了都走它） */
.ph{width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;color:#9ca3af;font-size:11px;font-weight:700;text-align:center;padding:0 10px;
  background:repeating-linear-gradient(45deg,#f9fafb,#f9fafb 10px,#f3f4f6 10px,#f3f4f6 20px)}
.ph .big{font-size:20px;opacity:.6}
/* 🔴 角标必须 nowrap：绝对定位在 flex 容器里会被按 CJK 逐字断行，「未完成」会变「未完 / 成」 */
.badge{position:absolute;left:8px;top:8px;padding:2px 8px;border-radius:7px;font-size:10.5px;font-weight:800;color:#fff;white-space:nowrap;cursor:pointer}
.badge:hover{filter:brightness(1.12)}
.cnt2{position:absolute;right:8px;top:8px;padding:2px 7px;border-radius:6px;font-size:10.5px;font-weight:800;background:rgba(17,24,39,.55);color:#fff;white-space:nowrap}
.stt{position:absolute;right:8px;bottom:8px;padding:2px 7px;border-radius:6px;font-size:10.5px;font-weight:800;color:#fff;white-space:nowrap}
.owner{position:absolute;left:8px;bottom:8px;padding:2px 7px;border-radius:6px;font-size:10.5px;font-weight:700;background:rgba(17,24,39,.45);color:#fff;white-space:nowrap}
.bd{padding:10px 12px 12px;display:flex;flex-direction:column;gap:5px;flex:1}
.tt{font-size:14px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sub{font-size:12px;color:var(--sub);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tm{font-size:11px;color:var(--faint)}
.acts{display:flex;gap:6px;margin-top:auto;padding-top:6px;flex-wrap:wrap}
.abtn{flex:1;min-width:58px;text-align:center;padding:7px 4px;border-radius:var(--r-sm);font-size:12px;font-weight:700;cursor:pointer;border:1px solid var(--bd);color:var(--sub);background:var(--card);user-select:none;text-decoration:none}
.abtn.pri{background:var(--grad-pri);color:var(--on-pri);border:none}
.abtn.ico{flex:0 0 32px;min-width:32px;padding:7px 0;font-size:14px;line-height:1}
.abtn.star.on{color:#f59e0b;border-color:rgba(251,191,36,.35);background:rgba(251,191,36,.14)}
.abtn:hover{filter:brightness(.97)}
.abtn:active{transform:translateY(1px)}

/* 标签行 */
.tags{display:flex;gap:4px;flex-wrap:wrap;align-items:center}
.tg{font-size:10.5px;font-weight:700;color:var(--pri-dark);background:var(--pri-050);border:1px solid var(--pri-200);border-radius:5px;padding:1px 6px;white-space:nowrap;max-width:88px;overflow:hidden;text-overflow:ellipsis}
.tg.add{color:var(--faint);background:transparent;border-style:dashed;border-color:var(--bd);cursor:pointer}
.tg.add:hover{color:var(--pri-dark);border-color:var(--pri-200)}

/* 多选 */
.selbox{position:absolute;left:8px;top:8px;z-index:4;width:20px;height:20px;border-radius:6px;background:rgba(255,255,255,.92);border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.25);display:none;align-items:center;justify-content:center;font-size:13px;font-weight:800;color:#fff}
body.selmode .selbox{display:flex}
body.selmode .badge{left:34px}
body.selmode .th{cursor:pointer}
body.selmode .acts{pointer-events:none;opacity:.4}
body.selmode .tg.add{pointer-events:none;opacity:.4}
.card.picked{border-color:var(--pri);box-shadow:0 0 0 2px var(--pri-200)}
.card.picked .selbox{background:var(--pri);border-color:var(--pri)}
.card.picked .selbox::after{content:'✓'}

/* 批量条 */
.bulk{position:fixed;left:50%;bottom:18px;transform:translateX(-50%) translateY(80px);z-index:70;display:flex;align-items:center;gap:10px;
  background:#111827;color:#fff;border-radius:999px;padding:7px 9px 7px 18px;box-shadow:0 8px 28px rgba(0,0,0,.28);transition:.2s;opacity:0;pointer-events:none;max-width:94vw}
.bulk.on{transform:translateX(-50%) translateY(0);opacity:1;pointer-events:auto}
.bulk .n{font-size:12.5px;font-weight:700;white-space:nowrap}
.bulk .n b{color:#5eead4;font-size:14px}
.bulk button{border:0;border-radius:999px;padding:7px 14px;font-size:12.5px;font-weight:800;cursor:pointer;font-family:var(--font);white-space:nowrap}
.bulk .go{background:var(--pri);color:var(--on-pri)}
.bulk .go:disabled{opacity:.45;cursor:not-allowed}
.bulk .ghost{background:rgba(255,255,255,.14);color:#fff}

/* 标签弹窗 */
.modal{position:fixed;inset:0;background:rgba(15,23,42,.55);display:none;align-items:center;justify-content:center;z-index:95;padding:20px}
.modal.on{display:flex}
.mbox{background:var(--card);border-radius:14px;padding:18px 18px 14px;width:100%;max-width:380px;box-shadow:0 18px 50px rgba(0,0,0,.25)}
.mbox h4{font-size:14px;font-weight:800;margin-bottom:3px}
.mbox p{font-size:12px;color:var(--sub);margin-bottom:10px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mbox input{width:100%;border:1px solid var(--bd);border-radius:9px;padding:9px 12px;font-size:13px;font-family:var(--font);outline:none;background:var(--card);color:var(--tx)}
.mbox input:focus{border-color:var(--pri)}
.mbox .sug{display:flex;gap:5px;flex-wrap:wrap;margin-top:9px}
.mbox .sug span{font-size:11.5px;font-weight:700;color:var(--sub);background:var(--bg);border:1px solid var(--bd);border-radius:999px;padding:3px 9px;cursor:pointer}
.mbox .sug span:hover{border-color:var(--pri-200);color:var(--pri-dark)}
.mbox .row{display:flex;gap:8px;justify-content:flex-end;margin-top:14px}
.mbox .row button{border:0;border-radius:9px;padding:8px 16px;font-size:13px;font-weight:800;cursor:pointer;font-family:var(--font)}
.mbox .c{background:var(--bg);color:var(--sub)}
.mbox .s{background:var(--pri);color:var(--on-pri)}

/* 时间轴 */
.tl{padding:16px 22px 8px}
.tl-day{position:relative;padding:0 0 16px 20px;border-left:2px solid var(--bd)}
.tl-day:last-child{border-left-color:transparent}
.tl-day h4{font-size:11.5px;font-weight:800;color:var(--sub);margin:0 0 9px -20px;padding-left:20px;position:relative}
.tl-day h4::before{content:'';position:absolute;left:-6px;top:5px;width:9px;height:9px;border-radius:50%;background:var(--pri);box-shadow:0 0 0 3px var(--card)}
.tl-item{display:flex;gap:10px;align-items:center;padding:7px 9px;border:1px solid var(--bd);border-radius:var(--r-sm);margin-bottom:6px;background:var(--card);cursor:pointer}
.tl-item:hover{border-color:var(--pri-200);background:var(--pri-050)}
.tl-item .tth{width:36px;height:36px;border-radius:6px;overflow:hidden;flex:none;background:var(--card2)}
.tl-item .tth img{width:100%;height:100%;object-fit:cover;pointer-events:none;-webkit-user-drag:none}
.tl-item .tx{min-width:0;flex:1}
.tl-item .tx b{display:block;font-size:12.5px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tl-item .tx span{font-size:11px;color:var(--faint);display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tl-item .tmt{font-size:11px;color:var(--faint);font-weight:700;flex:none}
.tl-item .st2{color:#f59e0b;font-weight:800}

.more{display:flex;justify-content:center;padding:6px 0 22px}
.more span{padding:8px 22px;border-radius:999px;border:1px solid var(--bd);background:var(--card);font-size:13px;font-weight:700;color:var(--sub);cursor:pointer;user-select:none}
.more span:hover{border-color:var(--pri-200);color:var(--pri-dark)}

/* 2026-10-15 雪碧需求：素材库的对比一律「满屏」—— 点卡片上的「⤢ 全屏对比」直接开整屏并排，
   卡片里不再展开小图行。全屏并排由共用组件 cmp.js 的 PTCompare.zoom() 出图。 */
.cmp-lb-nav{position:absolute;top:12px;left:50%;transform:translateX(-50%);z-index:7;display:flex;
  align-items:center;gap:10px;max-width:70vw;background:rgba(17,24,39,.72);color:#fff;
  padding:6px 12px;border-radius:999px;font-size:12px;font-weight:700;backdrop-filter:blur(2px)}
.cmp-lb-nav .t{max-width:34vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#cbd5e1;font-weight:600}
.cmp-lb-nav .n{color:#5eead4}
.cmp-lb-nav button{border:0;background:rgba(255,255,255,.16);color:#fff;width:26px;height:26px;
  border-radius:50%;font-size:15px;line-height:1;cursor:pointer;flex:none}
.cmp-lb-nav button:hover{background:rgba(255,255,255,.34)}
.cmp-lb-nav button:disabled{opacity:.35;cursor:default}
/* 灯箱 */
.lb{position:fixed;inset:0;background:rgba(15,23,42,.84);display:none;align-items:center;justify-content:center;z-index:60;cursor:zoom-out}
.lb.open{display:flex}
.lb img{max-width:92vw;max-height:92vh;border-radius:8px;box-shadow:0 12px 48px rgba(0,0,0,.45)}
.lb .cap{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);color:#e5e7eb;font-size:12px}
.empty{padding:70px 20px 30px;text-align:center;color:var(--sub);font-size:14px}
.empty b{display:block;font-size:15px;color:var(--tx);margin-bottom:6px}
.toast{position:fixed;left:50%;bottom:30px;transform:translateX(-50%);background:#111827;color:#fff;padding:10px 18px;border-radius:var(--r-ctl);font-size:13px;display:none;z-index:99;max-width:88vw;text-align:center}
body.selmode .toast{bottom:78px}
@media(max-width:640px){
  .hd{padding:10px 14px 0}
  .grid{grid-template-columns:repeat(2,1fr);gap:10px;padding:12px 14px 8px}
  .th{height:118px}
  .search{width:100%}
  .hd .right{width:100%;margin-left:0}
  .tl{padding:12px 14px 8px}
  .bulk{padding:6px 8px 6px 14px;gap:7px}
  .bulk button{padding:6px 11px;font-size:12px}
}
</style>
</head>
<body>
<div class="hd">
  <div class="r1">
    <h1>素材库</h1>
    <span class="tip">8 个生图板块的全部任务记录 · 收藏 / 标签 / 批量打包</span>
    <div class="right">
      <input class="search" id="q" type="search" placeholder="搜标题 / 参数…">
      <span class="rbtn" id="selBtn">多选</span>
      <span class="rbtn" id="refresh">刷新</span>
    </div>
  </div>
  <div class="chips" id="chips"></div>
  <div class="bar">
    <label>状态</label>
    <select id="fSt">
      <option value="">全部</option>
      <option value="done">已完成</option>
      <option value="partial">部分完成</option>
      <option value="running">生成中</option>
      <option value="failed">失败</option>
      <option value="draft">未完成</option>
    </select>
    <label>时间</label>
    <select id="fTm">
      <option value="">全部</option>
      <option value="today">今天</option>
      <option value="yest">昨天</option>
      <option value="7d">近 7 天</option>
      <option value="old">更早</option>
    </select>
    <label>产物</label>
    <select id="fTp">
      <option value="">全部</option>
      <option value="PNG">PNG</option>
      <option value="PSD">PSD</option>
      <option value="ZIP">ZIP</option>
    </select>
    <span class="fbtn" id="favBtn">★ 收藏 <i id="favN">0</i></span>
    <select id="fTag"><option value="">全部标签</option></select>
    <div class="vt">
      <span class="on" data-v="grid">网格</span>
      <span data-v="tl">时间轴</span>
    </div>
    <div class="cnt" id="cnt"></div>
  </div>
</div>
<div class="grid" id="grid"></div>
<div class="tl" id="tl" style="display:none"></div>
<div class="more" id="more" style="display:none"><span id="moreBtn">加载更多</span></div>
<div class="empty" id="empty" style="display:none"><b>还没有素材记录</b><span>去各板块生成第一批作品，这里会自动汇总</span></div>
<div class="toast" id="toast"></div>

<div class="bulk" id="bulk">
  <span class="n">已选 <b id="bulkN">0</b> 条</span>
  <button class="go" id="bulkDl" disabled>打包下载</button>
  <button class="ghost" id="bulkAll">全选本页</button>
  <button class="ghost" id="bulkClear">清空</button>
  <button class="ghost" id="bulkExit">退出</button>
</div>

<div class="modal" id="modal">
  <div class="mbox">
    <h4>设置标签</h4>
    <p id="tagWho">—</p>
    <input id="tagInput" placeholder="用逗号分隔，最多 6 个，如：主图，爆款，待改">
    <div class="sug" id="tagSug"></div>
    <div class="row"><button class="c" id="tagCancel">取消</button><button class="s" id="tagSave">保存</button></div>
  </div>
</div>

<div class="lb" id="lb"><img id="lbimg" alt=""><span class="cap">点击任意处或按 Esc 关闭</span></div>
<script>
var BASE = location.pathname.replace(/\/library\/?$/i, '').replace(/\/+$/, '');
var ITEMS = [], ADMIN = false, TOTAL = 0, SHOWN = 40;
var ALLTAGS = [], PICKED = {};

/* 8 个板块的身份色 —— 与各板块主题色一致，方便一眼分辨 */
var BOARDS = {
  pt:    {name: '图案提取',  c: '#0d9488'},
  wm:    {name: '批量去水印', c: '#94a3b8'},
  duotu: {name: '多图编辑',  c: '#ea580c'},
  hd:    {name: '高清修复',  c: '#0ea5e9'},
  dtl:   {name: '详情页生成', c: '#2563eb'},
  fk:    {name: '详情页复刻', c: '#9333ea'},
  swap:  {name: '商品替换',  c: '#16a34a'},
  aigc:  {name: 'AI 生图',   c: '#db2777'}
};
var ORDER = ['pt','wm','duotu','hd','dtl','fk','swap','aigc'];
var ST = {
  done:     {t: '已完成', c: '#059669'},
  partial:  {t: '部分完成', c: '#d97706'},
  running:  {t: '生成中', c: '#2563eb'},
  failed:   {t: '失败', c: '#dc2626'},
  draft:    {t: '未完成', c: '#6b7280'},
  stopped:  {t: '已停止', c: '#6b7280'},
  new:      {t: '待开始', c: '#6b7280'},
  analyzing:{t: '分析中', c: '#2563eb'}
};
var S = {board: '', st: '', tm: '', tp: '', q: '', view: 'grid', fav: false, tag: '', sel: false};

/* 相对路径（如 hd/api/... / aigc/api/...）在 /library/ 页面下需补站内前缀才是可用 URL */
function srcUrl(u){
  if (!u) return '';
  if (/^(https?:|data:|\/)/.test(u)) return u;
  return BASE + '/' + u;
}
/* 裁白边：后端 /api/trim 取源图字节 → 只切「整行 / 整列全白或全透明」的边 → 返回裁后图。
   前端 canvas 不行：COS 直链跨域，取像素会被污染。失败就 302 回 fb，前端无感降级。 */
function trimUrl(u){
  if (!u) return '';
  return BASE + '/api/trim?u=' + encodeURIComponent(u) + '&fb=' + encodeURIComponent(srcUrl(u));
}
function esc(s){
  return String(s == null ? '' : s).replace(/[&<>"']/g, function(m){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m];
  });
}
function toast(msg){
  var t = document.getElementById('toast');
  t.textContent = msg; t.style.display = 'block';
  clearTimeout(t._tm); t._tm = setTimeout(function(){ t.style.display = 'none'; }, 2600);
}
function fmtTime(ts){
  if (!ts) return '';
  var d = new Date(ts * 1000);
  function p(n){ return (n < 10 ? '0' : '') + n; }
  return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()) + ' ' + p(d.getHours()) + ':' + p(d.getMinutes());
}
function dayKey(ts){
  var d = new Date(ts * 1000);
  return d.getFullYear() + '-' + (d.getMonth() + 1) + '-' + d.getDate();
}
function bucket(ts){
  var n = new Date();
  var t0 = new Date(n.getFullYear(), n.getMonth(), n.getDate()).getTime() / 1000;
  if (ts >= t0) return 'today';
  if (ts >= t0 - 86400) return 'yest';
  if (ts >= t0 - 7 * 86400) return '7d';
  return 'old';
}
/* 产物类型：有对比图 = PNG，有 zip = ZIP，下载项里出现 PSD = PSD */
function typesOf(it){

  if ((it.pairs || []).length) out.push('PNG');
  if (it.zip) out.push('ZIP');
  (it.down || []).forEach(function(d){ if (d && /PSD/i.test(d.label || '')) out.push('PSD'); });
  return out;
}
/* 副标题去掉开头的板块名 —— 卡片左上角角标已经写了板块，重复一遍又挤又啰嗦 */

function findItem(id, board){

/* 灯箱：渐进加载 —— 先显示缩略图（秒开），全尺寸后台就绪后无缝替换 */

/* 下载：跨域 COS 直链走 fetch→blob（CORS 已全开），带本地兜底地址逐个尝试 */
function dlFile(urls, name){

    a.download = name;

  };
  var next = function(){
    if (i >= urls.length){ toast('下载失败：文件可能已过 72 小时保留期'); return; }
    var u = urls[i++];

      return r.blob();
    }).then(save).catch(next);
  };

}

/* ---------- 极简 ZIP（STORE，不压）----------
   为什么不用后端打包：服务器出口实测只有 ~1Mbps，20 张 2K 图走服务器要几分钟；
   而 COS 直链是跨域开放的，浏览器直接拉 CDN 再本地打包快 10 倍，还不占服务器带宽。
   PNG 本身已压缩，STORE（method=0）不损失体积多少，省掉 deflate 依赖。 */
var CRC_T = (function(){
  var t = new Uint32Array(256), c, n, k;
  for (n = 0; n < 256; n++){
    c = n;
    for (k = 0; k < 8; k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
    t[n] = c >>> 0;
  }
  return t;
})();
function crc32(u8){
  var c = 0xFFFFFFFF;
  for (var i = 0; i < u8.length; i++) c = CRC_T[(c ^ u8[i]) & 0xFF] ^ (c >>> 8);
  return (c ^ 0xFFFFFFFF) >>> 0;
}
function zipStore(files){
  var enc = new TextEncoder(), parts = [], central = [], offset = 0, i;
  for (i = 0; i < files.length; i++){
    var nm = enc.encode(files[i].name), data = files[i].data, crc = crc32(data);
    var lh = new DataView(new ArrayBuffer(30));
    lh.setUint32(0, 0x04034b50, true); lh.setUint16(4, 10, true);
    lh.setUint16(6, 0x0800, true); lh.setUint16(8, 0, true);
    lh.setUint16(10, 0, true); lh.setUint16(12, 0, true);
    lh.setUint32(14, crc, true); lh.setUint32(18, data.length, true);
    lh.setUint32(22, data.length, true);
    lh.setUint16(26, nm.length, true); lh.setUint16(28, 0, true);
    parts.push(new Uint8Array(lh.buffer), nm, data);
    var ch = new DataView(new ArrayBuffer(46));
    ch.setUint32(0, 0x02014b50, true); ch.setUint16(4, 10, true); ch.setUint16(6, 10, true);
    ch.setUint16(8, 0x0800, true); ch.setUint16(10, 0, true);
    ch.setUint16(12, 0, true); ch.setUint16(14, 0, true);
    ch.setUint32(16, crc, true); ch.setUint32(20, data.length, true);
    ch.setUint32(24, data.length, true);
    ch.setUint16(28, nm.length, true);
    ch.setUint16(30, 0, true); ch.setUint16(32, 0, true);
    ch.setUint16(34, 0, true); ch.setUint16(36, 0, true);
    ch.setUint32(38, 0, true); ch.setUint32(42, offset, true);
    central.push(new Uint8Array(ch.buffer), nm);
    offset += 30 + nm.length + data.length;
  }
  var cdSize = 0;
  for (i = 0; i < central.length; i++) cdSize += central[i].length;
  var eo = new DataView(new ArrayBuffer(22));
  eo.setUint32(0, 0x06054b50, true);
  eo.setUint16(8, files.length, true); eo.setUint16(10, files.length, true);
  eo.setUint32(12, cdSize, true); eo.setUint32(16, offset, true);
  return new Blob(parts.concat(central, [new Uint8Array(eo.buffer)]), {type: 'application/zip'});
}

/* 批量下载：并发 4 拉 COS，全部到手再打包（边下边压会让进度条骗人） */
function downloadPicked(){
  var sel = ITEMS.filter(function(x){ return PICKED[keyOf(x)]; });
  if (!sel.length){ toast('先勾选几条记录'); return; }
  var tasks = [];
  sel.forEach(function(it){
    var head = (BOARDS[it.board] ? BOARDS[it.board].name : it.board) + '_'
      + String(it.title || '').replace(/[\\/:*?"<>|\s]+/g, '_').slice(0, 20);
    (it.pairs || []).forEach(function(p, i){
      var u = p.out_full || p.out;
      if (!u) return;
      var lab = String(p.label || ('0' + (i + 1))).replace(/[\\/:*?"<>|]+/g, '');
      tasks.push({url: srcUrl(u), name: head + '/' + head + '_' + lab + '.png'});
    });
  });
  if (!tasks.length){ toast('选中的记录里没有可下载的成品（可能已过保留期）'); return; }
  if (tasks.length > 120){
    toast('一次最多打包 120 张，当前 ' + tasks.length + ' 张，请少选几条');
    return;
  }
  var btn = document.getElementById('bulkDl');
  btn.disabled = true; btn.textContent = '打包中 0/' + tasks.length;
  var files = [], queue = tasks.slice(), running = 0, done = 0, fail = 0;

  function grab(t){
    return fetch(t.url).then(function(r){
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r.arrayBuffer();
    }).then(function(ab){
      files.push({name: t.name, data: new Uint8Array(ab)});
    }).catch(function(){ fail++; });
  }
  function pump(){
    while (running < 4 && queue.length){
      running++;
      grab(queue.shift()).then(function(){
        running--; done++;
        btn.textContent = '打包中 ' + done + '/' + tasks.length;
        if (!queue.length && !running) finish(); else pump();
      });
    }
  }
  function finish(){
    btn.disabled = false; btn.textContent = '打包下载';
    if (!files.length){ toast('全部下载失败：图片可能已过保留期'); return; }
    var d = new Date(), p = function(n){ return (n < 10 ? '0' : '') + n; };
    var name = '素材库_' + d.getFullYear() + p(d.getMonth() + 1) + p(d.getDate()) + '_' + p(d.getHours()) + p(d.getMinutes()) + '.zip';
    var url = URL.createObjectURL(zipStore(files));
    var a = document.createElement('a');
    a.href = url; a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function(){ URL.revokeObjectURL(url); }, 15000);
    toast('已打包 ' + files.length + ' 张' + (fail ? '（' + fail + ' 张失败）' : ''));
  }
  pump();
}

/* ---- 满屏对比 ----
   一组 = 一条 pair（原图 + 成品）；多页/多屏记录会有 N 组 → 顶部导航条翻页（← → 也行）。 */
var _cmpSt = null;
function cmpablePairs(it){
  var out = [];
  (it.pairs || []).forEach(function(p){
    var sf = p.src_full || p.src, of = p.out_full || p.out;
    if (sf && of) out.push({src: sf, out: of, label: p.label || ''});
  });
  return out;
}
function openCmpFullscreen(it, idx){
  var ps = cmpablePairs(it);
  if (!ps.length){ toast('这条记录缺原图或成品，没法对比（可点「预览」看单张）'); return; }
  if (idx < 0) idx = 0;
  if (idx >= ps.length) idx = ps.length - 1;
  if (!window.PTCompare || !window.PTCompare.zoom){
    toast('对比组件还没加载好，刷新一下页面再试'); return;
  }
  var p = ps[idx];
  _cmpSt = {it: it, idx: idx, pairs: ps};
  window.PTCompare.zoom({src: trimUrl(p.src), out: trimUrl(p.out),
                         labSrc: '原图', labOut: p.label || '成品', tight: true});
  mountCmpNav();
}
function mountCmpNav(){
  var lb = document.querySelector('.cmp-lb');
  if (!lb || !_cmpSt) return;
  var st = _cmpSt, n = st.pairs.length;
  var nav = document.createElement('div');
  nav.className = 'cmp-lb-nav';
  nav.innerHTML = '<span class="t">' + esc(st.it.title || '') + '</span>'
    + (n > 1
        ? '<button type="button" data-nav="-1" aria-label="上一组">‹</button>'
          + '<span class="n">' + (st.idx + 1) + ' / ' + n + '</span>'
          + '<button type="button" data-nav="1" aria-label="下一组">›</button>'
          + '<span style="color:#9ca3af;font-weight:600">← → 翻页</span>'
        : '<span class="n">原图 vs 成品</span>');
  nav.querySelectorAll('button[data-nav]').forEach(function(b){
    b.onclick = function(ev){
      ev.stopPropagation();

    };
  });

}
document.addEventListener('keydown', function(e){
  if (!document.querySelector('.cmp-lb') || !_cmpSt) return;
  if (_cmpSt.pairs.length < 2) return;
  if (e.key === 'ArrowLeft'){ openCmpFullscreen(_cmpSt.it, _cmpSt.idx - 1); e.preventDefault(); }
  else if (e.key === 'ArrowRight'){ openCmpFullscreen(_cmpSt.it, _cmpSt.idx + 1); e.preventDefault(); }
});

/* 回原板块：素材库是在 shell 的常驻 iframe 里打开的，改父窗口 hash 才切得动板块 */
function gotoBoard(board){
  if (!BOARDS[board]) return;
  try{
    if (window.parent && window.parent !== window){
      window.parent.location.hash = board;
      return;
    }
  }catch(e){ /* 跨域/沙箱 → 走下面的兜底 */ }
  location.href = BASE + '/#' + board;
}

/* 支持 ?tid= 深链的板块（aigc/dtl/swap 前端都认这个参数）→ 卡片角标能直接跳回那条任务 */
var DEEPLINK = {aigc: 1, dtl: 1, swap: 1};
function gotoTask(board, tid){
  if (!DEEPLINK[board] || !tid){ gotoBoard(board); return; }
  var q = '?tid=' + encodeURIComponent(tid);
  try{
    var p = window.parent;
    /* 壳子里已经备好了这个入口：切菜单 + 确保 iframe 存在 + 给地址带上参数 + 显示它。
       自己手搓会漏掉「首次进入时 iframe 还没被创建」这种情况（实测跳到 aigc 但没带 tid）。 */
    if (p && p !== window && typeof p.openBoard === 'function'){
      p.openBoard(board, q);
      return;
    }
  }catch(e){ /* 跨域/沙箱 → 直接开 */ }
  location.href = BASE + '/' + board + '/' + q;
}

/* 图裂了（归档记录过 72h 本地路由必 404）→ 用 CSS 占位顶掉，绝不留白框或裂图标 */
function imFail(box, txt){

/* ---- 收藏 / 标签 ---- */
function postMark(body){
  return fetch(BASE + '/api/library/mark', {
    method: 'POST', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify(body)
  }).then(function(r){ return r.json(); });
}
function toggleFav(it){
  var next = !it.fav;
  it.fav = next; paintMarks(it);
  postMark({board: it.board, id: it.id, fav: next}).then(function(d){
    if (!d || !d.ok){ throw new Error((d && d.error) || 'failed'); }
    it.fav = !!d.fav; it.tags = d.tags || it.tags || [];
    paintMarks(it); renderCounters();
  }).catch(function(){
    it.fav = !next; paintMarks(it); toast('收藏失败，稍后再试');
  });
}
var _tagIt = null;
function openTag(it){
  _tagIt = it;
  document.getElementById('tagWho').textContent = (BOARDS[it.board] ? BOARDS[it.board].name + ' · ' : '') + it.title;
  document.getElementById('tagInput').value = (it.tags || []).join('，');
  renderTagSug();
  document.getElementById('modal').classList.add('on');
  setTimeout(function(){ document.getElementById('tagInput').focus(); }, 30);
}
function renderTagSug(){
  var box = document.getElementById('tagSug');
  box.innerHTML = '';
  ALLTAGS.slice(0, 8).forEach(function(t){
    var s = document.createElement('span');
    s.textContent = t.tag;
    s.onclick = function(){
      var inp = document.getElementById('tagInput');
      var cur = inp.value.trim().replace(/[，,]\s*$/, '');

  });
}
function saveTag(){
  if (!_tagIt) return;
  var raw = document.getElementById('tagInput').value || '';
  var tags = raw.split(/[，,;；\s]+/).map(function(s){ return s.trim(); })
    .filter(function(s){ return !!s; }).slice(0, 6);
  var it = _tagIt;
  postMark({board: it.board, id: it.id, tags: tags}).then(function(d){
    if (!d || !d.ok){ toast('保存失败'); return; }
    it.tags = d.tags || [];
    paintMarks(it); renderCounters(); loadTags();
    document.getElementById('modal').classList.remove('on');
    toast(tags.length ? '已保存 ' + tags.length + ' 个标签' : '已清空标签');
  }).catch(function(){ toast('保存失败，稍后再试'); });
}
function tagsHtml(it){
  var ts = it.tags || [], h = '<div class="tags">';
  ts.slice(0, 3).forEach(function(t){ h += '<span class="tg">' + esc(t) + '</span>'; });
  if (ts.length > 3) h += '<span class="tg">+' + (ts.length - 3) + '</span>';
  h += '<span class="tg add" data-act="tag">' + (ts.length ? '编辑标签' : '+ 标签') + '</span>';
  return h + '</div>';
}
/* 只改这一张卡的收藏态/标签行，不整页重绘（重绘会让懒加载图闪一下） */
function paintMarks(it){
  var cards = document.querySelectorAll('.card');
  for (var i = 0; i < cards.length; i++){
    var c = cards[i];
    if (c.getAttribute('data-id') !== it.id || c.getAttribute('data-board') !== it.board) continue;
    var st = c.querySelector('.star');
    if (st){ st.classList.toggle('on', !!it.fav); st.textContent = it.fav ? '★' : '☆'; }
    var box = c.querySelector('.tags');
    if (box){
      /* 🔴 outerHTML 替换会把新节点上的 [data-act] 事件一起丢掉 → 必须重新绑这一张卡 */
      box.outerHTML = tagsHtml(it);
      bindCard(c);
    }
    return;
  }
}
function renderCounters(){
  var f = ITEMS.filter(function(x){ return x.fav; }).length;
  document.getElementById('favN').textContent = f;
  renderChips();
}

function buildActs(it){
  var pairs = it.pairs || [], downs = it.down || [];
  var acts = '';
  var cmpN = cmpablePairs(it).length;
  if (cmpN){
    acts += '<span class="abtn pri" data-act="cmp" title="原图与成品并排铺满屏幕">⤢ 对比'
      + (cmpN > 1 ? ' ' + cmpN : '') + '</span>';
  }else if ((pairs.length && pairs[0].out) || it.thumb){
    acts += '<span class="abtn pri" data-act="pv">预览</span>';
  }
  if (downs.length){
    acts += '<span class="abtn" data-act="dl" data-di="0">' + esc(downs[0].label || '下载') + '</span>';
  }else if (it.zip){
    acts += '<span class="abtn" data-act="zip">打包</span>';
  }
  acts += '<span class="abtn ico star' + (it.fav ? ' on' : '') + '" data-act="fav" title="收藏" aria-label="收藏">'
    + (it.fav ? '★' : '☆') + '</span>';
  acts += '<span class="abtn ico" data-act="tag" title="标签" aria-label="标签">🏷</span>';
  return acts;
}

function filtered(){
  var q = S.q.toLowerCase();
  return ITEMS.filter(function(x){
    if (S.board && x.board !== S.board) return false;
    if (S.st && (x.status || '') !== S.st) return false;
    if (S.tm && bucket(x.ts) !== S.tm) return false;
    if (S.tp && typesOf(x).indexOf(S.tp) < 0) return false;
    if (S.fav && !x.fav) return false;
    if (S.tag && (x.tags || []).indexOf(S.tag) < 0) return false;
    if (q){
      var b = BOARDS[x.board];
      var k = (x.title + ' ' + x.sub + ' ' + (b ? b.name : '') + ' ' + (x.tags || []).join(' ')).toLowerCase();
      if (k.indexOf(q) < 0) return false;
    }
    return true;
  }).sort(function(a, b){ return (b.ts || 0) - (a.ts || 0); });
}

function cardHtml(it){
  var b = BOARDS[it.board] || {name: it.board, c: '#6b7280'};
  var stt = ST[it.status] || {t: it.status || '—', c: '#6b7280'};

function bindCard(c){
  var id = c.getAttribute('data-id'), board = c.getAttribute('data-board');
  var it = findItem(id, board);
  if (!it) return;
  c.querySelectorAll('[data-act]').forEach(function(b){
    b.onclick = function(ev){
      ev.preventDefault(); ev.stopPropagation();
      if (S.sel){ togglePick(it, c); return; }
      var act = b.getAttribute('data-act');
      if (act === 'cmp'){ openCmpFullscreen(it, 0); return; }
      if (act === 'zip'){ dlFile([srcUrl(it.zip)], (it.board || 'task') + '_' + it.id + '.zip'); return; }
      if (act === 'dl'){
        var d = (it.down || [])[parseInt(b.getAttribute('data-di'), 10)] || {};
        var us = [];
        if (d.url) us.push(srcUrl(d.url));
        if (d.fb && d.fb !== d.url) us.push(srcUrl(d.fb));
        dlFile(us, d.label || 'file');
        return;
      }
      if (act === 'fav'){ toggleFav(it); return; }
      if (act === 'tag'){ openTag(it); return; }
      if (act === 'go'){ gotoTask(it.board, it.id); return; }
      if (act === 'pv'){ preview(it); return; }
    };
  });
  /* 多选模式下点卡片任意空白处都算选中（.acts 在 selmode 下 pointer-events:none，点击会落到这里） */
  c.onclick = function(){ if (S.sel) togglePick(it, c); };
  var th = c.querySelector('.th');
  if (th) th.onclick = function(ev){
    ev.stopPropagation();
    if (S.sel){ togglePick(it, c); return; }
    preview(it);
  };
  var im = th ? th.querySelector('img') : null;
  if (im) im.onerror = function(){ imFail(th, '图已过期'); };
}
function preview(it){
  if (cmpablePairs(it).length){ openCmpFullscreen(it, 0); return; }
  var ps = it.pairs || [], th = '', fu = '', cap = '';
  for (var k = 0; k < ps.length; k++){
    if (ps[k].out){
      th = srcUrl(ps[k].out); fu = srcUrl(ps[k].out_full || ps[k].out); cap = ps[k].label || '';
      break;
    }
  }
  if (!th && it.thumb){ th = srcUrl(it.thumb); fu = th; cap = '缩略图'; }
  if (th) openLb(th, fu, cap);
}

/* ---- 多选 ---- */
function togglePick(it, el){
  var k = keyOf(it);
  if (PICKED[k]) delete PICKED[k]; else PICKED[k] = 1;
  if (el) el.classList.toggle('picked', !!PICKED[k]);
  updateBulk();
}
function pickedCount(){ return Object.keys(PICKED).length; }
function updateBulk(){
  var n = pickedCount();
  document.getElementById('bulkN').textContent = n;
  document.getElementById('bulkDl').disabled = !n;
  document.getElementById('bulk').classList.toggle('on', S.sel);
}
function setSel(on){
  S.sel = on;
  document.body.classList.toggle('selmode', on);
  document.getElementById('selBtn').classList.toggle('on', on);
  document.getElementById('selBtn').textContent = on ? '退出多选' : '多选';
  if (!on) PICKED = {};
  updateBulk(); render();
}

function renderChips(){
  var box = document.getElementById('chips');
  var h = '<span class="chip' + (S.board === '' ? ' on' : '') + '" data-b="">全部 <i class="n">' + ITEMS.length + '</i></span>';
  ORDER.forEach(function(b){
    var c = ITEMS.filter(function(x){ return x.board === b; }).length;
    h += '<span class="chip' + (S.board === b ? ' on' : '') + '" data-b="' + b + '">'
      + '<i class="cd" style="background:' + BOARDS[b].c + '"></i>' + BOARDS[b].name
      + ' <i class="n">' + c + '</i></span>';
  });
  box.innerHTML = h;
  box.querySelectorAll('.chip').forEach(function(el){
    el.onclick = function(){
      S.board = el.getAttribute('data-b') || '';
      SHOWN = 40;
      renderChips(); render();
    };
  });
}

function render(){
  var list = filtered();
  document.getElementById('cnt').innerHTML = '共 <b>' + list.length + '</b> 条'
    + (list.length < ITEMS.length ? '（全部 ' + ITEMS.length + ' 条）' : '');
  var g = document.getElementById('grid'), tl = document.getElementById('tl'),
      em = document.getElementById('empty'), more = document.getElementById('more');
  var page = list.slice(0, SHOWN);

  g.style.display = (S.view === 'grid' && page.length) ? 'grid' : 'none';
  tl.style.display = (S.view === 'tl' && page.length) ? 'block' : 'none';
  em.style.display = page.length ? 'none' : 'block';
  more.style.display = (page.length && list.length > SHOWN) ? 'flex' : 'none';
  if (page.length && list.length > SHOWN){
    document.getElementById('moreBtn').textContent = '加载更多（还有 ' + (list.length - SHOWN) + ' 条）';
  }

  if (!page.length){
    var why = S.fav ? '★ 收藏里' : (S.tag ? '标签「' + esc(S.tag) + '」下' : (S.board ? BOARDS[S.board].name : '当前筛选'));
    em.innerHTML = '<b>' + why + '暂时没有记录</b><span>换个筛选条件，或去各板块生成作品</span>';
    return;
  }

  if (S.view === 'grid'){
    g.innerHTML = page.map(cardHtml).join('');
    g.querySelectorAll('.card').forEach(bindCard);
  }else{
    var byDay = {}, order = [];
    page.forEach(function(x){
      var k = dayKey(x.ts);
      if (!byDay[k]){ byDay[k] = []; order.push(k); }
      byDay[k].push(x);
    });
    tl.innerHTML = order.map(function(k){
      return '<div class="tl-day"><h4>' + k + ' · ' + byDay[k].length + ' 条</h4>'
        + byDay[k].map(function(x){
            var b = BOARDS[x.board] || {name: x.board, c: '#6b7280'};
            var ph = '<div style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:10px;color:#9ca3af">' + esc(b.name.slice(0, 2)) + '</div>';
            return '<div class="tl-item" data-id="' + esc(x.id) + '" data-board="' + esc(x.board) + '">'
              + '<div class="tth">' + (x.thumb ? '<img src="' + esc(srcUrl(x.thumb)) + '" alt="">' : ph) + '</div>'
              + '<div class="tx"><b>' + (x.fav ? '<span class="st2">★ </span>' : '') + esc(x.title) + '</b>'
              + '<span>' + esc(b.name) + ' · ' + esc(subOf(x)) + (x.tags && x.tags.length ? ' · 🏷' + esc(x.tags.join('、')) : '') + '</span></div>'
              + '<div class="tmt">' + fmtTime(x.ts).slice(5) + '</div></div>';
          }).join('') + '</div>';
    }).join('');
    tl.querySelectorAll('.tl-item img').forEach(function(im){
      im.onerror = function(){ imFail(im.parentNode, ''); };
    });
    tl.querySelectorAll('.tl-item').forEach(function(el){
      el.onclick = function(){
        var it = findItem(el.getAttribute('data-id'), el.getAttribute('data-board'));
        if (!it) return;
        if (S.sel){ togglePick(it, el); el.style.outline = PICKED[keyOf(it)] ? '2px solid var(--pri)' : ''; return; }
        preview(it);
      };
    });
  }
}

function loadTags(){
  fetch(BASE + '/api/library/tags').then(function(r){ return r.json(); }).then(function(d){
    ALLTAGS = d.tags || [];
    var sel = document.getElementById('fTag');
    var cur = S.tag;
    var h = '<option value="">全部标签</option>';
    ALLTAGS.forEach(function(t){
      h += '<option value="' + esc(t.tag) + '">' + esc(t.tag) + '（' + t.n + '）</option>';
    });
    sel.innerHTML = h;
    sel.value = cur;
  }).catch(function(){});
}

function load(force){
  fetch(BASE + '/api/library' + (force ? '?_=' + Date.now() : ''))
    .then(function(r){ return r.json(); })
    .then(function(d){
      ITEMS = d.items || []; ADMIN = !!d.admin; TOTAL = d.total || ITEMS.length;
      SHOWN = 40;
      renderChips(); render();
      document.getElementById('favN').textContent = ITEMS.filter(function(x){ return x.fav; }).length;
      loadTags();
    }).catch(function(){ toast('加载失败，请稍后刷新重试'); });
}

document.getElementById('q').oninput = function(){ S.q = this.value.trim(); SHOWN = 40; render(); };
document.getElementById('fSt').onchange = function(){ S.st = this.value; SHOWN = 40; render(); };
document.getElementById('fTm').onchange = function(){ S.tm = this.value; SHOWN = 40; render(); };
document.getElementById('fTp').onchange = function(){ S.tp = this.value; SHOWN = 40; render(); };
document.getElementById('fTag').onchange = function(){ S.tag = this.value; SHOWN = 40; render(); };
document.getElementById('favBtn').onclick = function(){
  S.fav = !S.fav;
  this.classList.toggle('on', S.fav);
  SHOWN = 40; render();
};
document.querySelectorAll('.vt span').forEach(function(el){
  el.onclick = function(){
    document.querySelectorAll('.vt span').forEach(function(x){ x.classList.remove('on'); });
    el.classList.add('on'); S.view = el.getAttribute('data-v'); render();
  };
});
document.getElementById('moreBtn').onclick = function(){ SHOWN += 40; render(); };
document.getElementById('refresh').onclick = function(){ load(true); };
document.getElementById('selBtn').onclick = function(){ setSel(!S.sel); };

/* 批量条 */
document.getElementById('bulkDl').onclick = downloadPicked;
document.getElementById('bulkAll').onclick = function(){
  var list = filtered().slice(0, SHOWN);
  var allOn = list.every(function(it){ return PICKED[keyOf(it)]; });
  list.forEach(function(it){
    if (allOn) delete PICKED[keyOf(it)]; else PICKED[keyOf(it)] = 1;
  });
  render(); updateBulk();
};
document.getElementById('bulkClear').onclick = function(){ PICKED = {}; render(); updateBulk(); };
document.getElementById('bulkExit').onclick = function(){ setSel(false); };

/* 标签弹窗 */
document.getElementById('tagCancel').onclick = function(){ document.getElementById('modal').classList.remove('on'); };
document.getElementById('tagSave').onclick = saveTag;
document.getElementById('modal').onclick = function(ev){ if (ev.target === this) this.classList.remove('on'); };
document.getElementById('tagInput').onkeydown = function(e){ if (e.key === 'Enter'){ e.preventDefault(); saveTag(); } };
document.addEventListener('keydown', function(e){
  if (e.key === 'Escape'){
    var m = document.getElementById('modal');
    if (m.classList.contains('on')) m.classList.remove('on');
    else if (S.sel) setSel(false);
  }
});

load(false);
</script>
</body>
</html>
